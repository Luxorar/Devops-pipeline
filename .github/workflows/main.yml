name: Spring Boot CI/CD Pipeline

on: 
  push:
    branches:
      - main   

jobs:
  test:
    name: Run Test with jaCoCO
    runs-on: ubuntu-latest

    steps: 
    #CHECKOUT DE REPOSITORIO

    - name: Checkout code
      uses: actions/checkout@v4
    
    # CONFIGURAR JDK
    - name: Set up JDK 17 
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17
    # CACHE DEPENDENCIAS MAVEN
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.n2
        key: ${{ runner.os  }}-n2-${{ hashFiles('**/pom.xml')  }}
        restore-keys: |
          ${{ runner.os }}-m2
    #CONTRUIR PROYECTO Y EJECUTAR TEST
    - name: Build and Test
      run: mvn clean verify

    #PUBLICAR COBERTURA DE JACOCO
    - name: Upload JaCoCo Report
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: target/site/jacoco/


